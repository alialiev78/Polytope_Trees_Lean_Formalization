fidelity:
  divergences: >-
    The concrete objects are symmetry-weighted finite facet pairings. Circuit
    rank belongs to the dual graph. Affine geometric presentation masses are
    connected to these counts. Palettes are constructed for every simplex of
    dimension at least two. A general signed-group and regular-flag interface
    derives palettes and the relation tau = h*r. Actual Euclidean symmetry
    groups, supporting faces and intrinsic facet restriction are constructed
    from finite spanning flag-regular vertex sets in dimension at least two.
    Unique extension, determinant compatibility, negative stabilizers, all-facet
    intrinsic palettes, tau = h*r, presentation masses and affine quotient
    compatibility are proved without supplying a palette or extension hypothesis.
    A separate concrete stellar-subdivision family proves preservation of
    homeomorphism type and Corollary 5.3 for finite pure triangulations of
    dimension at least two, using ordinary classes and a polynomial unmarking
    bound. The lower bound is 2^(n-1)/(v+n)^v. Appendix D includes parity,
    endpoints and equality cases. Cardano and Ferrari radicals use branches
    fixed at the origin. All analytic identifications are local there.
review:
  status: unchecked
  notes: >-
    No independent human mathematical review or Palomar registration is claimed.
    All original and intrinsic proof modules are included in Article and the
    transitive axiom audit. Current results are recorded in verification.json.
    The separate Challenge specifies 39 enumerative, analytic, asymptotic,
    ordinary-triangulation and geometric-extension claims. Its imports are
    exclusively from Mathlib and it has no definition holes. Local comparison
    of exported statements and kernel checks, and any environment limitations,
    are recorded separately from external review in verification.json.

alignment:
