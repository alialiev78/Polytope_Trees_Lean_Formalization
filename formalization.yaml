version: v0.4
project:
  name: "The Number of Polytope Trees and Beyond — Lean 4 formalization"
  description: >-
    Symmetry-weighted enumeration of finite facet-pairing diagrams and polytope
    trees: cut-join recurrences, factorial formulas, formal exponential
    generating functions, local analytic counting series with specified radical
    branches, binomial identities and asymptotic equivalents. The development
    also proves unique extension of intrinsic facet isometries for finite
    spanning flag-regular Euclidean cells, derives their geometric presentation
    masses, and proves an exponential lower bound for ordinary simplicial
    triangulation classes from any fixed finite pure triangulation of dimension
    at least two.
  authors: [Ali Aliev]
  responsible_maintainers: [Ali Aliev]
  license: MIT
classification:
  arxiv: [math.CO, math.GT]
  msc2020: [05A15, 05A19, 05C30, 57Q15, 20B25, 05E45]
